<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>S&amp;P500 선물</title>
<style>
  :root { color-scheme: light; --page:#f9f9f7; --text:#0b0b0b; --sub:#52514e; --muted:#898781; --border:rgba(11,11,11,.10); }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) { color-scheme: dark; --page:#0d0d0d; --text:#fff; --sub:#c3c2b7; --muted:#898781; --border:rgba(255,255,255,.10); }
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; }
  body { background:var(--page); color:var(--text); font-family:system-ui,-apple-system,"Segoe UI","Malgun Gothic",sans-serif;
         display:flex; flex-direction:column; padding:12px 16px 16px; gap:10px; }
  .top { display:flex; flex-wrap:wrap; align-items:center; gap:8px 12px; }
  h1 { font-size:18px; font-weight:800; }
  .seg { display:flex; gap:6px; flex-wrap:wrap; }
  .seg button { border:1px solid var(--border); background:transparent; color:var(--sub); border-radius:8px; padding:4px 12px;
                font-size:13px; font-family:inherit; cursor:pointer; }
  .seg button.on { background:var(--text); color:var(--page); border-color:var(--text); font-weight:700; }
  a.ext { font-size:13px; color:var(--sub); margin-left:auto; }
  .note { font-size:12px; color:var(--muted); line-height:1.5; }
  #chart { flex:1; min-height:360px; border:1px solid var(--border); border-radius:10px; overflow:hidden; }
  #chart > div { height:100%; }
</style>
</head>
<body>
  <div class="top">
    <h1>S&amp;P500 선물</h1>
    <div class="seg" id="seg">
      <button data-s="OANDA:SPX500USD" class="on">S&amp;P 500 (OANDA)</button>
      <button data-s="FOREXCOM:SPXUSD">S&amp;P 500 (FOREX.com)</button>
      <button data-s="FX_IDC:USDKRW">원/달러</button>
    </div>
    <a class="ext" href="https://kr.tradingview.com/chart/SnDIzMhe/?symbol=CME_MINI%3AES1%21" target="_blank" rel="noopener">트레이딩뷰에서 내 차트 열기 ↗</a>
  </div>
  <p class="note">선물은 한국 시각 월 08:00 ~ 토 07:00 거래(매일 07:00~08:00 쉼, 미국 서머타임 땐 1시간 당겨짐). 360750 ≈ S&amp;P 선물 × 원/달러.
    트레이딩뷰 무료 위젯은 CME 선물(ES1!)을 막아 두어, 선물과 거의 같이 24시간 움직이는 S&amp;P500 CFD 가격을 보여 줍니다. 선물 원본은 오른쪽 위 링크로.</p>
  <div id="chart"></div>
<script>
  function draw(sym) {
    var box = document.getElementById('chart');
    box.innerHTML = '<div class="tradingview-widget-container" style="height:100%;width:100%"><div class="tradingview-widget-container__widget" style="height:100%;width:100%"></div></div>';
    var dark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    var s = document.createElement('script');
    s.src = 'https://s3.tradingview.com/external-embedding/embed-widget-advanced-chart.js';
    s.async = true;
    s.text = JSON.stringify({ autosize: true, symbol: sym, interval: '30', timezone: 'Asia/Seoul', theme: dark ? 'dark' : 'light',
      style: '1', locale: 'kr', allow_symbol_change: true, calendar: false, hide_volume: false, support_host: 'https://www.tradingview.com' });
    box.firstChild.appendChild(s);
  }
  document.getElementById('seg').addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    [].forEach.call(this.children, function (x) { x.classList.toggle('on', x === b); });
    draw(b.getAttribute('data-s'));
  });
  draw('OANDA:SPX500USD');
</script>
</body>
</html>
